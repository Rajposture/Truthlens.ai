# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then in Render choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file
# automatically and provisions the backend below.
services:
  - type: web
    name: truthlens-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: FRONTEND_ORIGINS
        value: http://localhost:3000
      - key: RATE_LIMIT_VERIFY
        value: 20/minute
      - key: RATE_LIMIT_CHAT
        value: 30/minute
