# Local development only. For production, deploy the backend to
# Render/Railway and the frontend to Vercel (see README.md).
#
# Usage:
#   cp backend/.env.example backend/.env   # then add your GROQ_API_KEY
#   docker compose up --build
services:
  backend:
    build:
      context: ./backend
    container_name: truthlens-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
    volumes:
      - truthlens-data:/app/data
    restart: unless-stopped

volumes:
  truthlens-data:
