version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truthlens-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    volumes:
      - chroma_data:/app/data/chroma_db
      - chat_data:/app/data/chat_history

volumes:
  chroma_data:
  chat_data:
